name: Render Anime Edit

on:
  push:
    branches: [main, master, claude/dreamy-ramanujan-g4pui6]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies for Remotion
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed libasound2 → libasound2t64; libxss1 dropped
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libx11-6 libxcb1 \
            libxext6 fonts-liberation \
            libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Remotion Chrome
        run: npx remotion browser ensure

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/Root.tsx AnimeEdit out/anime-edit.mp4 \
            --codec h264 \
            --jpeg-quality 95 \
            --concurrency 2 \
            --log verbose

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: anime-edit-${{ github.sha }}
          path: out/anime-edit.mp4
          retention-days: 30

      - name: Show output size
        run: ls -lh out/anime-edit.mp4
