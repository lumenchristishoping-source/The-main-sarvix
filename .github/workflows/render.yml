name: Render Dragon Ball Edit

on:
  push:
    branches: [main, master, claude/dreamy-ramanujan-g4pui6]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install system dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libx11-6 libxcb1 \
            libxext6 fonts-liberation ffmpeg \
            libasound2t64 || sudo apt-get install -y libasound2

      - name: Find Chrome
        run: |
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium)
          echo "CHROME_PATH=$CHROME" >> $GITHUB_ENV
          echo "Found Chrome at: $CHROME"
          $CHROME --version

      - name: Render DragonBallEdit
        run: |
          mkdir -p out
          ./node_modules/.bin/remotion render src/Root.tsx DragonBallEdit out/dragon-ball-edit.mp4 \
            --codec h264 \
            --jpeg-quality 95 \
            --concurrency 2 \
            --browser-executable-path="$CHROME_PATH" \
            --log verbose

      - name: Upload Dragon Ball Edit
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ball-edit-${{ github.sha }}
          path: out/dragon-ball-edit.mp4
          retention-days: 30

      - name: Show output size
        run: ls -lh out/dragon-ball-edit.mp4
